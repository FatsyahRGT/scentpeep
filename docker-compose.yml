name: scentpeep

services:
  # ==========================================
  # PHP-FPM Application Service
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scentpeep_app
    restart: unless-stopped
    working_dir: /var/www/html
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    environment:
      APP_NAME: ${APP_NAME:-Scentpeep}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://scentpeep-management-system.duckdns.org:8082}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-scentpeep}
      DB_USERNAME: ${DB_USERNAME:-scentpeep_user}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - scentpeep-internal
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================
  # NGINX Web Server (Patched Version >= 1.31.7)
  # ==========================================
  web:
    image: ${NGINX_IMAGE:-nginx:1.31.7-alpine}
    container_name: scentpeep_web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    ports:
      # Port Web Host VPS: 8082 -> Container Port: 80
      - "${HTTP_PORT:-8082}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
      - storage_data:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - scentpeep-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/robots.txt || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ==========================================
  # MySQL Database Service (Hardened my.cnf)
  # ==========================================
  db:
    image: mysql:8.4
    container_name: scentpeep_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-scentpeep}
      MYSQL_USER: ${DB_USERNAME:-scentpeep_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      # Port DB Host VPS: 3308 -> Container Port: 3306
      # Dibatasi hanya untuk 127.0.0.1 (Localhost VPS/SSH Tunnel) agar tidak terekspos ke publik internet
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    networks:
      - scentpeep-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-scentpeep_user}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  scentpeep-internal:
    driver: bridge

volumes:
  db_data:
    driver: local
  storage_data:
    driver: local
